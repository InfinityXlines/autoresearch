version: 1
shared_wiki_path: ~/shared-memory/wiki/

# Add your agent names here. Each agent gets their own knowledge base.
# setup.sh will prompt you for names and generate this section.
agents:
  default:
    path: ~/.autoresearch/agents/default/
    auto_compile: true       # Compile on ingest
    dream_recompile: true    # Full recompile during automated cycles

search:
  max_results: 20
  snippet_length: 200

lint:
  check_staleness: true
  staleness_threshold_days: 30
  check_orphans: true
  check_dead_links: true
  suggest_connections: true

llm:
  provider: "claude-cli"       # Options: claude-cli, anthropic-api, openai-api
  model: "claude-sonnet-4-6"   # Model for standalone compilation/queries
  timeout: 120                 # Seconds per LLM call
